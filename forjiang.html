<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jiang' 2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>LOVE IS HERE</h1>
        <div class="score-box">
            <div class="label">分数</div>
            <div id="score">0</div>
        </div>
        <button onclick="initGame()">新游戏</button>
    </div>

    <div class="game-container" id="grid">
        <!-- 游戏结束遮罩 -->
        <div id="game-over" class="hidden">
            <h2>游戏结束!</h2>
            <button onclick="initGame()">再来一局</button>
        </div>
    </div>

    <p class="tips">滑动屏幕或按方向键开始游戏</p>

    <script src="script.js"></script>
</body>
</html>
