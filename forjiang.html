<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>jiang' 2048</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header">
        <h1>LOVE IS HERE</h1>
        <div class="score-box">
            <div class="label">分数</div>
            <div id="score">0</div>
        </div>
            <!-- 新增：手动保存和读取区域 -->
    <div style="display: flex; justify-content: space-between; margin-bottom: 15px; gap: 10px;">
        <button onclick="manualSave()" style="background: #8f7a66; color: white; border: none; padding: 10px; border-radius: 3px; font-weight: bold; flex: 1; cursor: pointer;">
            💾 保存进度
        </button>
        <button onclick="startNewGameManual()" style="background: #8f7a66; color: white; border: none; padding: 10px; border-radius: 3px; font-weight: bold; flex: 1; cursor: pointer;">
            🔄 新游戏
        </button>
    </div>

    <!-- 读取存档按钮（默认隐藏，JS检测到存档后会显示） -->
    <div id="load-container" style="display: none; margin-bottom: 15px;">
        <button onclick="loadGame()" style="background: #edc22e; color: white; border: none; padding: 10px 20px; border-radius: 3px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer;">
            📂 读取上次存档
        </button>
    </div>
    </div>

    <div class="game-container" id="grid">
        <!-- 游戏结束遮罩 -->
        <div id="game-over" class="hidden">
            <h2>游戏结束!</h2>
            <button onclick="initGame()">再来一局</button>
        </div>
    </div>

    <p class="tips">滑动屏幕或按方向键开始游戏</p>

    <script src="script.js"></script>
</body>
</html>
